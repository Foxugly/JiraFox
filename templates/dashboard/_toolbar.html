{% load i18n %}
{% trans "Dashboard" as dashboard_kicker %}
{% blocktrans with sprint_name=sprint.name asvar dashboard_title %}Sprint: {{ sprint_name }}{% endblocktrans %}
<div class="page-toolbar dashboard-toolbar-inline">
    <div class="page-toolbar-main">
        <div class="page-toolbar-kicker">
            <i class="fa-solid fa-chart-column"></i>{{ dashboard_kicker }}
        </div>
        <h1 class="page-toolbar-title">{{ dashboard_title }}</h1>
    </div>
    <div class="page-toolbar-actions">
        {% include "dashboard/_toolbar_actions.html" %}
    </div>
</div>
