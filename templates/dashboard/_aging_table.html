{% load i18n %}
<div class="card p-3">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
        <div>
            <div class="text-uppercase text-secondary small">{% trans "Table" %}</div>
            <div class="fw-semibold">{% trans "Top aging items" %}</div>
        </div>
        <a id="agingOpenJira" class="btn btn-sm btn-outline-primary" href="#" target="_blank"
           rel="noopener noreferrer">
            <i class="fa-brands fa-jira me-2"></i> {% trans "Open in Jira" %}
        </a>
    </div>

    <div class="table-responsive">
        <table id="agingTable" class="table table-striped table-hover align-middle nowrap dashboard-table-full">
            <thead>
            <tr>
                <th>{% trans "Key" %}</th>
                <th>{% trans "Title" %}</th>
                <th>{% trans "Status" %}</th>
                <th class="text-end">{% trans "Age" %}</th>
                <th>{% trans "Assignee" %}</th>
                <th class="text-end">{% trans "Action" %}</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="text-secondary small mt-2" id="tableHint">-</div>
</div>
