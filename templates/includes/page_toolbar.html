{% load i18n %}
<div class="page-toolbar">
    <div class="page-toolbar-main">
        {% if toolbar_kicker %}
            <div class="page-toolbar-kicker">
                {% if toolbar_icon %}<i class="{{ toolbar_icon }}"></i>{% endif %}
                {{ toolbar_kicker }}
            </div>
        {% endif %}
        <div>
            <h1 class="page-toolbar-title">{{ toolbar_title }}</h1>
        </div>
    </div>
    {% if toolbar_actions_template %}
        <div class="page-toolbar-actions">
            {% include toolbar_actions_template %}
        </div>
    {% endif %}
</div>
