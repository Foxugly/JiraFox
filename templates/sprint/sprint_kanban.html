{% extends "base.html" %}
{% load static %}

{% block title %}JiraFox - Sprint {{ sprint.name }} - Kanban{% endblock %}

{% block content %}
    <section class="page-shell glass-panel section-stack">
        {% include "sprint/sprint_header.html" %}

        <div class="utility-panel">
            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
                <div>
                    <h2 class="h4 mb-1">Kanban</h2>
                    <p class="inline-note mb-0">Vue colonne par colonne des issues du sprint.</p>
                </div>
            </div>
            <div id="kanban" class="kanban-grid"></div>
        </div>
    </section>
{% endblock %}

{% block js %}
    <script>
        window.SPRINT_KANBAN_PAGE = {
            apiUrl: "{% url 'sprint-api-kanban' sprint.id %}"
        };
    </script>
    <script src="{% static 'js/sprint-kanban.js' %}"></script>
{% endblock %}
