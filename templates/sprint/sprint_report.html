{% extends "base.html" %}

{% block title %}JiraFox - Sprint {{ sprint.name }} - Report{% endblock %}

{% block content %}
    <div class="container-fluid py-3">
        {% include "sprint/sprint_header.html" %}
        <table id="StatusesTable" class="table table-striped table-bordered table-hover mt-3">
            <thead>
            <tr>
                <th>NAME</th>
                <th>JQL</th>
                <th>ACTIONS</th>
            </tr>
            </thead>
            <tbody>
            {% for s in statuses %}
                <tr>
                    <td>{{ s.name }}</td>
                    <td>{{ s.jql }}</td>
                    <td><a class="btn btn-outline-secondary" href="{{ s.url_jql }}" target="_blank" rel="noopener">
                        <i class="fa-brands fa-jira"></i></a></td>
                </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
