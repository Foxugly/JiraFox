{% load i18n %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <!-- Titre -->
    <a class="btn btn-sm btn-outline-secondary" href="{% url 'sprint-list' %}">
        <i class="fa-solid fa-arrow-left me-2"></i>{% trans "Back" %}
    </a>
    <div>
        <div class="d-flex align-items-center gap-2 flex-wrap">
            <h1 class="h4 mb-0">
                <span class="text-muted">{{ issue.project }}</span> /
                <span class="fw-semibold mono">{{ issue.key }}</span>
            </h1>

            <span class="badge text-bg-secondary">{{ issue.issueType|default:"—" }}</span>
            <span class="badge soft-badge">{{ issue.state|default:"—" }}</span>
        </div>

        <div class="text-secondary mt-1 truncate-2" style="max-width: 1100px;">
            {{ issue.summary|default:"—" }}
        </div>
    </div>
    <!-- Boutons -->

    <div class="d-flex gap-2">
        <a class="btn btn-outline-primary"
           href="{{ issue.url }}"
           target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-jira me-2"></i>{%  trans "Ouvrir dans Jira" %}
        </a>
    </div>
</div>
